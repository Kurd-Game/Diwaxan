<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container, .dashboard-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .dashboard-container {
            max-width: 800px;
            display: none;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #5a6fd6;
        }

        .error-msg {
            color: #ff4d4d;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        /* بەشەکانی ناوەوە */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 20px;
        }

        .card p {
            color: #e67e22;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="login-container" id="loginBox">
        <h2>چوونەژوورەوە</h2>
        <div class="input-group">
            <label>ناوی بەکارهێنەر (Username)</label>
            <input type="text" id="username" placeholder="ناوی بەکارهێنەر بنووسە">
        </div>
        <div class="input-group">
            <label>پاسۆرد (Password)</label>
            <input type="password" id="password" placeholder="پاسۆرد بنووسە">
        </div>
        <button class="btn" onclick="checkLogin()">چوونە ژوورەوە</button>
        <p class="error-msg" id="errorMsg">ناوی بەکارهێنەر یان پاسۆرد هەڵەیە!</p>
    </div>

    <div class="dashboard-container" id="dashboardBox">
        <h2>بەخێربێن بۆ بەشەکان</h2>
        <div class="grid-container">
            <div class="card">
                <h3>Asiacell</h3>
                <p>بـــەم زووانـــە</p>
            </div>
            <div class="card">
                <h3>Korek</h3>
                <p>بـــەم زووانـــە</p>
            </div>
            <div class="card">
                <h3>Fastpay</h3>
                <p>بـــەم زووانـــە</p>
            </div>
            <div class="card">
                <h3>Fib</h3>
                <p>بـــەم زووانـــە</p>
            </div>
            <div class="card">
                <h3>Discord</h3>
                <p>بـــەم زووانـــە</p>
            </div>
            <div class="card">
                <h3>Telegram</h3>
                <p>بـــەم زووانـــە</p>
            </div>
            <div class="card">
                <h3>Whats App</h3>
                <p>بـــەم زووانـــە</p>
            </div>
        </div>
    </div>

    <script>
        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const error = document.getElementById('errorMsg');

            // پشکنینی یۆسەر و پاسۆرد
            if (user === 'admin' && pass === 'admin1234') {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboardBox').style.display = 'block';
            } else {
                error.style.display = 'block';
            }
        }
    </script>

</body>
</html>
